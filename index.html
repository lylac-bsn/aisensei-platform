<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamecollege - ログイン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hub.css?v=20261026-sfx">
    <link rel="stylesheet" href="css/homework.css?v=20261026-retry">
    <link rel="icon" href="images/tab-logo.png" type="image/png">
</head>
<body class="login-page">

    <div id="login-view">
        <div class="login-left-panel" aria-hidden="true">
            <div class="floating-elements">
                <span class="float-letter" style="top: 10%; left: 20%;">A</span>
                <span class="float-letter" style="top: 25%; left: 70%;">B</span>
                <span class="float-letter" style="top: 45%; left: 15%;">C</span>
                <span class="float-star" style="top: 15%; left: 60%;">★</span>
                <span class="float-star" style="top: 60%; left: 75%;">★</span>
                <span class="float-cloud" style="top: 35%; left: 50%;">☁</span>
            </div>
            <div class="mascot-container">
                <img src="images/fukurou.svg" alt="" class="mascot-wave">
            </div>
        </div>
        
        <div class="login-right-panel">
            <div class="login-header">
                <h1>Gamecollege</h1>
                <p class="login-subtitle">ラーニー先生と一緒に、英語の宿題を楽しく復習しよう</p>
            </div>
            
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="display-name">なまえ</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">😊</span>
                        <input type="text" id="display-name" name="displayName" placeholder="たろう" required autocomplete="nickname" maxlength="50">
                    </div>
                    <p class="form-group-hint">ラーニー先生が呼ぶときの名前です</p>
                </div>

                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">✉️</span>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required autocomplete="email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">🔒</span>
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>
                
                <button type="submit" class="login-submit-btn" id="login-submit-btn">
                    <span>ログイン</span>
                </button>
            </form>
            
            <p id="login-error" class="error-message" role="alert" aria-live="polite"></p>
        </div>
    </div>

    <main id="platform-hub" class="platform-hub gc-app" hidden>
        <aside class="gc-side" id="gc-side">
            <p class="gc-brand">Gamecollege</p>
            <nav class="gc-nav-list" aria-label="メインメニュー">
                <button type="button" class="gc-nav" id="hub-home" data-hub-home>
                    <span>ホーム</span>
                </button>
                <div id="hub-student" hidden>
                    <button type="button" class="gc-nav" data-hub-action="book" data-hub-label="講座を予約"><span>講座を予約</span></button>
                    <button type="button" class="gc-nav" data-hub-action="my-homework" data-hub-label="宿題とレポート"><span>宿題とレポート</span></button>
                    <button type="button" class="gc-nav" data-hub-action="inbox" data-hub-label="受信箱"><span>受信箱</span></button>
                    <button type="button" class="gc-nav" data-hub-action="quiz" data-hub-label="クイズ"><span>クイズ</span></button>
                    <button type="button" class="gc-nav" data-hub-action="family" data-hub-label="かぞくコード"><span>かぞくコード</span></button>
                </div>
                <div id="hub-parent" hidden>
                    <button type="button" class="gc-nav" data-hub-action="book" data-hub-label="講座を予約"><span>講座を予約</span></button>
                    <button type="button" class="gc-nav" data-hub-action="children" data-hub-label="子ども"><span>子ども</span></button>
                    <button type="button" class="gc-nav" data-hub-action="tickets" data-hub-label="チケット"><span>チケット</span></button>
                    <button type="button" class="gc-nav" data-hub-action="inbox" data-hub-label="受信箱"><span>受信箱</span></button>
                </div>
                <div id="hub-teacher" hidden>
                    <button type="button" class="gc-nav" data-hub-action="publish-class" data-hub-label="クラス"><span>クラス</span></button>
                    <button type="button" class="gc-nav" data-hub-action="attendance" data-hub-label="出席"><span>出席</span></button>
                    <button type="button" class="gc-nav" data-hub-action="assign-homework" data-hub-label="宿題とレポート"><span>宿題とレポート</span></button>
                    <button type="button" id="hub-ticket-settings" class="gc-nav gc-owner-only" data-hub-action="ticket-settings" data-hub-label="チケット" hidden><span>チケット</span></button>
                    <button type="button" class="gc-nav" data-hub-action="quiz" data-hub-label="クイズ"><span>クイズ</span></button>
                    <a class="gc-nav" href="admin.html"><span>管理画面</span></a>
                </div>
            </nav>
        </aside>
        <div class="gc-main">
            <header class="gc-top">
                <button type="button" id="gc-menu" class="gc-icon-btn" aria-label="メニュー">☰</button>
                <h1 id="hub-page-title">ホーム</h1>
                <div class="gc-user">
                    <div class="gc-bell-wrap">
                        <button type="button" id="hub-bell" class="gc-bell" hidden aria-label="通知" aria-expanded="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
                            <span id="hub-bell-count" class="gc-bell-count" hidden></span>
                        </button>
                        <div id="hub-bell-panel" class="gc-bell-panel" hidden></div>
                    </div>
                    <div>
                        <strong id="hub-user-name">アカウント</strong>
                        <span id="hub-role-label"></span>
                    </div>
                    <button type="button" id="hub-sfx" class="gc-sfx" aria-pressed="true" aria-label="効果音オン">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5l4.5 4V5Z"/><path d="M15 9.5a4 4 0 0 1 0 5"/><path d="M18 7a7.5 7.5 0 0 1 0 10"/></svg>
                    </button>
                    <button type="button" id="hub-logout" class="gc-text-btn">ログアウト</button>
                </div>
            </header>
            <div class="gc-workspace">
                <div id="hub-menu">
                    <section class="gc-welcome">
                        <p id="hub-date"></p>
                        <h2 id="hub-greeting">おかえりなさい</h2>
                        <p id="hub-lead" class="gc-lead"></p>
                    </section>
                    <div class="gc-dash" id="hub-dash"></div>
                </div>
                <section id="hub-panel" hidden>
                    <div id="hub-panel-placeholder" hidden>
                        <h2 id="hub-placeholder-title"></h2>
                        <p>準備中</p>
                    </div>
                    <div id="hub-panel-platform" hidden></div>
                    <div id="hub-panel-homework" hidden>
                        <h2>アクアリウムの宿題</h2>
                        <p>ビギナーのレッスンで、アクアリウムの宿題をすすめます。</p>
                        <a class="gc-primary" href="page1.html">レッスンをはじめる</a>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div id="level-selection-overlay" class="level-selection-overlay" hidden></div>

    <script type="module" src="js/app.js?v=20261026-retry"></script>

    <div id="fixed-corner-logo">
        <img src="images/Growbuddy.png" alt="Growbuddy">
    </div>

</body>
</html>
