<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamecollege - ログイン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/tab-logo.png" type="image/png">
</head>
<body class="login-page">

    <div id="login-view">
        <div class="login-left-panel" aria-hidden="true">
            <div class="floating-elements">
                <span class="float-letter" style="top: 10%; left: 20%;">A</span>
                <span class="float-letter" style="top: 25%; left: 70%;">B</span>
                <span class="float-letter" style="top: 45%; left: 15%;">C</span>
                <span class="float-star" style="top: 15%; left: 60%;">★</span>
                <span class="float-star" style="top: 60%; left: 75%;">★</span>
                <span class="float-cloud" style="top: 35%; left: 50%;">☁</span>
            </div>
            <div class="mascot-container">
                <img src="images/fukurou.svg" alt="" class="mascot-wave">
            </div>
        </div>
        
        <div class="login-right-panel">
            <div class="login-header">
                <h1>Gamecollege</h1>
                <p class="login-subtitle">ラーニー先生と一緒に、英語の宿題を楽しく復習しよう</p>
            </div>
            
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="display-name">なまえ</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">😊</span>
                        <input type="text" id="display-name" name="displayName" placeholder="たろう" required autocomplete="nickname" maxlength="50">
                    </div>
                    <p class="form-group-hint">ラーニー先生が呼ぶときの名前です</p>
                </div>

                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">✉️</span>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required autocomplete="email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">🔒</span>
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>
                
                <button type="submit" class="login-submit-btn" id="login-submit-btn">
                    <span>ログイン</span>
                </button>
            </form>
            
            <p id="login-error" class="error-message" role="alert" aria-live="polite"></p>
        </div>
    </div>

    <main id="platform-hub" class="platform-hub" hidden>
        <div class="platform-hub__card">
            <header class="platform-hub__top">
                <div>
                    <p class="platform-hub__brand">Gamecollege</p>
                    <h1 id="hub-greeting">おかえりなさい</h1>
                    <p id="hub-role-label" class="platform-hub__role"></p>
                </div>
                <button type="button" id="hub-logout" class="platform-hub__logout">ログアウト</button>
            </header>

            <div id="hub-menu">
                <div id="hub-student" class="hub-grid" hidden>
                    <button type="button" class="hub-btn hub-btn--book" data-hub-action="book" data-hub-label="講座を予約">
                        <span class="hub-btn__label">講座を予約</span>
                        <span class="hub-btn__hint">準備中</span>
                    </button>
                    <button type="button" class="hub-btn hub-btn--homework" data-hub-action="my-homework" data-hub-label="宿題">
                        <span class="hub-btn__label">宿題</span>
                        <span class="hub-btn__hint">先生の宿題とアクアリウム</span>
                    </button>
                    <button type="button" class="hub-btn hub-btn--game" data-hub-action="quiz" data-hub-label="クイズ">
                        <span class="hub-btn__label">クイズ</span>
                        <span class="hub-btn__hint">コードで参加</span>
                    </button>
                    <button type="button" class="hub-btn hub-btn--children" data-hub-action="family" data-hub-label="かぞくコード">
                        <span class="hub-btn__label">かぞくコード</span>
                        <span class="hub-btn__hint">保護者とつながる</span>
                    </button>
                </div>

                <div id="hub-parent" class="hub-grid" hidden>
                    <button type="button" class="hub-btn hub-btn--book" data-hub-action="book" data-hub-label="講座を予約">
                        <span class="hub-btn__label">講座を予約</span>
                        <span class="hub-btn__hint">準備中</span>
                    </button>
                    <button type="button" class="hub-btn hub-btn--children" data-hub-action="children" data-hub-label="子ども">
                        <span class="hub-btn__label">子ども</span>
                        <span class="hub-btn__hint">準備中</span>
                    </button>
                    <button type="button" class="hub-btn hub-btn--tickets" data-hub-action="tickets" data-hub-label="チケット">
                        <span class="hub-btn__label">チケット</span>
                        <span class="hub-btn__hint">準備中</span>
                    </button>
                    <button type="button" class="hub-btn hub-btn--inbox" data-hub-action="inbox" data-hub-label="受信箱">
                        <span class="hub-btn__label">受信箱</span>
                        <span class="hub-btn__hint">準備中</span>
                    </button>
                </div>

                <div id="hub-teacher" class="hub-grid" hidden>
                    <button type="button" class="hub-btn hub-btn--classes" data-hub-action="publish-class" data-hub-label="クラス">
                        <span class="hub-btn__label">クラス</span>
                        <span class="hub-btn__hint">準備中</span>
                    </button>
                    <button type="button" class="hub-btn hub-btn--attendance" data-hub-action="attendance" data-hub-label="出席">
                        <span class="hub-btn__label">出席</span>
                        <span class="hub-btn__hint">準備中</span>
                    </button>
                    <button type="button" class="hub-btn hub-btn--teacher-homework" data-hub-action="assign-homework" data-hub-label="宿題">
                        <span class="hub-btn__label">宿題</span>
                        <span class="hub-btn__hint">準備中</span>
                    </button>
                    <button type="button" id="hub-ticket-settings" class="hub-btn hub-btn--tickets" data-hub-action="ticket-settings" data-hub-label="チケット設定" hidden>
                        <span class="hub-btn__label">チケット設定</span>
                        <span class="hub-btn__hint">毎月の枚数</span>
                    </button>
                    <button type="button" class="hub-btn hub-btn--game" data-hub-action="quiz" data-hub-label="クイズ">
                        <span class="hub-btn__label">クイズ</span>
                        <span class="hub-btn__hint">ルームをひらく</span>
                    </button>
                    <a class="hub-btn hub-btn--admin" href="admin.html">
                        <span class="hub-btn__label">管理画面</span>
                        <span class="hub-btn__hint">既存の管理ページ</span>
                    </a>
                </div>
            </div>

            <section id="hub-panel" class="platform-hub__panel" hidden>
                <button type="button" id="hub-back" class="platform-hub__back">もどる</button>
                <div id="hub-panel-placeholder" hidden>
                    <h2 id="hub-placeholder-title"></h2>
                    <p class="hub-preparing">準備中</p>
                </div>
                <div id="hub-panel-platform" hidden></div>
                <div id="hub-panel-homework" hidden>
                    <h2>アクアリウムの宿題</h2>
                    <p>ビギナーのレッスンで、アクアリウムの宿題をすすめます。</p>
                    <a class="hub-btn hub-btn--homework" href="page1.html">
                        <span class="hub-btn__label">レッスンをはじめる</span>
                        <span class="hub-btn__hint">ビギナー</span>
                    </a>
                </div>
            </section>
        </div>
    </main>

    <div id="level-selection-overlay" class="level-selection-overlay" hidden></div>

    <script type="module" src="js/app.js"></script>

    <div id="fixed-corner-logo">
        <img src="images/Growbuddy.png" alt="Growbuddy">
    </div>

</body>
</html>
