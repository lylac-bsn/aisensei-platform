<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COllAB に参加</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/collab.css">
  <link rel="icon" href="images/tab-logo.png" type="image/png">
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 216, 90, 0.45), transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(103, 184, 255, 0.4), transparent 38%),
        #FFF9F1;
      font-family: "M PLUS Rounded 1c", sans-serif;
      color: #352521;
    }
    .join-shell { width: min(420px, 100%); }
  </style>
</head>
<body>
  <main class="join-shell" id="join-root">
    <section class="cb-join-page">
      <h1 class="cb-brand">COllAB</h1>
      <p class="cb-sub">読み込んでいます…</p>
    </section>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4QAYLn2KBxAZ6HZNpzlHS4aNZE9KwAtQ",
      authDomain: "ai-sensei-8849b.firebaseapp.com",
      projectId: "ai-sensei-8849b",
      storageBucket: "ai-sensei-8849b.firebasestorage.app",
      messagingSenderId: "483139385570",
      appId: "1:483139385570:web:cc62d4391366a27db406bb",
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const root = document.getElementById("join-root");
    const params = new URLSearchParams(location.search);
    const preset = String(params.get("pin") || "").toUpperCase();

    async function callFunction(name, data) {
      const token = await auth.currentUser.getIdToken();
      const response = await fetch(`https://asia-northeast1-ai-sensei-8849b.cloudfunctions.net/${name}`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ data }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body?.error?.message || "うまくいきませんでした。");
      return body.result || body;
    }

    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    }

    function paintLogin(note = "") {
      root.innerHTML = `
        <section class="cb-join-page">
          <h1 class="cb-brand">COllAB</h1>
          <p class="cb-sub">ログインして参加コードを入力</p>
          <input id="email" class="cb-search" type="email" placeholder="メール" autocomplete="username">
          <input id="password" class="cb-search" type="password" placeholder="パスワード" autocomplete="current-password">
          <input id="pin" class="cb-search" maxlength="8" placeholder="PIN" value="${escapeHtml(preset)}" style="text-align:center;letter-spacing:0.2em;font-size:1.3rem;">
          <button type="button" class="cb-btn cb-btn-primary" id="go">参加</button>
          <p class="cb-save-note is-error">${escapeHtml(note)}</p>
        </section>`;
      root.querySelector("#go").onclick = async () => {
        try {
          await signInWithEmailAndPassword(auth, root.querySelector("#email").value, root.querySelector("#password").value);
          await join(root.querySelector("#pin").value);
        } catch (error) {
          paintLogin(error.message);
        }
      };
    }

    function paintPin(note = "") {
      root.innerHTML = `
        <section class="cb-join-page">
          <h1 class="cb-brand">COllAB</h1>
          <p class="cb-sub">先生のコードを入力</p>
          <input id="pin" class="cb-search" maxlength="8" placeholder="PIN" value="${escapeHtml(preset)}" style="text-align:center;letter-spacing:0.2em;font-size:1.3rem;">
          <button type="button" class="cb-btn cb-btn-primary" id="go">参加</button>
          <p class="cb-save-note is-error">${escapeHtml(note)}</p>
          <a class="cb-back" href="index.html">← ホーム</a>
        </section>`;
      root.querySelector("#go").onclick = () => join(root.querySelector("#pin").value).catch((error) => paintPin(error.message));
      root.querySelector("#pin").focus();
    }

    async function join(code) {
      root.innerHTML = `<section class="cb-join-page"><p class="cb-sub">入室しています…</p></section>`;
      const result = await callFunction("joinQuiz", { code });
      location.href = `index.html#collab-room=${encodeURIComponent(result.id)}`;
      // Fallback live wait on this page if hub redirect is awkward
      root.innerHTML = `
        <section class="cb-join-page">
          <h2>参加しました</h2>
          <p class="cb-sub">${escapeHtml(result.title || "COllAB")}</p>
          <p class="cb-sub">先生がスタートするまで、このまま待ってください。<br>または <a href="index.html">ホーム</a> の COllAB を開いてください。</p>
        </section>`;
      onSnapshot(doc(db, "quizRooms", result.id), (snap) => {
        const data = snap.data() || {};
        if (data.status && data.status !== "lobby") {
          location.href = "index.html";
        }
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) paintLogin();
      else if (preset) join(preset).catch((error) => paintPin(error.message));
      else paintPin();
    });
  </script>
</body>
</html>
